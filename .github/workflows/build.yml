name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Create project files
        run: |
          set -e
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "YTDownloader"
          include(":app")
          EOF_FILE
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF_FILE
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.ytdl"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.ytdl"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  ndk { abiFilters += listOf("arm64-v8a") }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }

              packaging { jniLibs { useLegacyPackaging = true } }
          }

          dependencies {
              implementation("io.github.junkfood02.youtubedl-android:library:0.17.2")
              implementation("io.github.junkfood02.youtubedl-android:ffmpeg:0.17.2")
          }
          EOF_FILE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="YT Downloader"
                  android:theme="@android:style/Theme.Material.Light.DarkActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p app/src/main/res/layout
          cat > app/src/main/res/layout/activity_main.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="20dp">

              <EditText
                  android:id="@+id/url"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:hint="Paste YouTube link"
                  android:inputType="textUri" />

              <RadioGroup
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="12dp"
                  android:orientation="horizontal">

                  <RadioButton
                      android:id="@+id/rbVideo"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:checked="true"
                      android:text="Video (MP4)" />

                  <RadioButton
                      android:id="@+id/rbAudio"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginStart="16dp"
                      android:text="Audio (MP3)" />
              </RadioGroup>

              <Button
                  android:id="@+id/btn"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="12dp"
                  android:enabled="false"
                  android:text="Download" />

              <ProgressBar
                  android:id="@+id/progress"
                  style="?android:attr/progressBarStyleHorizontal"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="16dp"
                  android:max="100" />

              <TextView
                  android:id="@+id/status"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="12dp"
                  android:text="Starting engine..." />
          </LinearLayout>
          EOF_FILE
          mkdir -p app/src/main/java/com/example/ytdl
          cat > app/src/main/java/com/example/ytdl/MainActivity.kt <<'EOF_FILE'
          package com.example.ytdl

          import android.app.Activity
          import android.content.ContentValues
          import android.content.Intent
          import android.os.Bundle
          import android.os.Environment
          import android.provider.MediaStore
          import android.widget.Button
          import android.widget.EditText
          import android.widget.ProgressBar
          import android.widget.RadioButton
          import android.widget.TextView
          import com.yausername.ffmpeg.FFmpeg
          import com.yausername.youtubedl_android.YoutubeDL
          import com.yausername.youtubedl_android.YoutubeDLRequest
          import java.io.File

          class MainActivity : Activity() {

              private lateinit var urlBox: EditText
              private lateinit var audioBtn: RadioButton
              private lateinit var button: Button
              private lateinit var progress: ProgressBar
              private lateinit var status: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  urlBox = findViewById(R.id.url)
                  audioBtn = findViewById(R.id.rbAudio)
                  button = findViewById(R.id.btn)
                  progress = findViewById(R.id.progress)
                  status = findViewById(R.id.status)

                  // Link shared from YouTube app
                  if (intent?.action == Intent.ACTION_SEND) {
                      urlBox.setText(intent.getStringExtra(Intent.EXTRA_TEXT) ?: "")
                  }

                  Thread {
                      try {
                          YoutubeDL.getInstance().init(application)
                          FFmpeg.getInstance().init(application)
                          runOnUiThread {
                              status.text = "Ready"
                              button.isEnabled = true
                          }
                      } catch (e: Exception) {
                          runOnUiThread { status.text = "Init failed: ${e.message}" }
                      }
                  }.start()

                  button.setOnClickListener {
                      val link = urlBox.text.toString().trim()
                      if (link.isEmpty()) {
                          status.text = "Paste a link first"
                          return@setOnClickListener
                      }
                      startDownload(link, audioBtn.isChecked)
                  }
              }

              private fun startDownload(link: String, audio: Boolean) {
                  button.isEnabled = false
                  progress.progress = 0
                  status.text = "Downloading..."

                  Thread {
                      try {
                          val dir = File(cacheDir, "dl")
                          dir.deleteRecursively()
                          dir.mkdirs()

                          val req = YoutubeDLRequest(link)
                          req.addOption("-o", dir.absolutePath + "/%(title).80s.%(ext)s")
                          req.addOption("--no-playlist")
                          if (audio) {
                              req.addOption("-x")
                              req.addOption("--audio-format", "mp3")
                          } else {
                              req.addOption("-f", "bv*[height<=1080]+ba/b")
                              req.addOption("--merge-output-format", "mp4")
                          }

                          YoutubeDL.getInstance().execute(req) { p, _, line ->
                              runOnUiThread {
                                  progress.progress = p.toInt().coerceIn(0, 100)
                                  status.text = line
                              }
                          }

                          val files = dir.listFiles() ?: emptyArray()
                          for (f in files) saveToDownloads(f)

                          runOnUiThread {
                              progress.progress = 100
                              status.text = "Done! Saved in Downloads folder (${files.size} file)"
                              button.isEnabled = true
                          }
                      } catch (e: Exception) {
                          runOnUiThread {
                              status.text = "Error: ${e.message}"
                              button.isEnabled = true
                          }
                      }
                  }.start()
              }

              private fun saveToDownloads(f: File) {
                  val values = ContentValues().apply {
                      put(MediaStore.MediaColumns.DISPLAY_NAME, f.name)
                      put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS)
                  }
                  val uri = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values)
                      ?: return
                  contentResolver.openOutputStream(uri)?.use { out ->
                      f.inputStream().use { it.copyTo(out) }
                  }
                  f.delete()
              }
          }
          EOF_FILE

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: YT-Downloader-APK
          path: app/build/outputs/apk/debug/*.apk
